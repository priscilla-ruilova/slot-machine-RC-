<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Lilita+One&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Titan+One&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Assets/styles.css">
</head>
<body>
    <h1>Slot Machine</h1>
    <p>Test your luck online and never lose money IRL!</p>
    <span id="balance">Balance: </span>
    <section class="reels">
        <span id="reel1">?</span>
        <span id="reel2">?</span>
        <span id="reel3">?</span>
    </section>
    <section class="lastSection">
        <label for="bet">Bet: </label>
        <button id="betMin">Add 5</button>
        <button id="betMax">Add 50</button>
    </section>
    <span class="luck">Good Luck!</span>
    <p id="message"></p>
    
    <script type="text/javascript" src="Assets/main.js"></script>
</body>
</html>
